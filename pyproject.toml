[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hwostyle"
description = "Matplotlib style sheets and utilities for HWO direct imaging figures. Dual-mode dark (talks) and light (papers) themes with domain-specific colormaps."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.8", "cycler", "tol-colors", "numpy"]

[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
    "sphinx",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-autoapi",
    "ipython",
    "matplotlib",
]
test = [
    "pytest",
    "hypothesis",
    "pytest-cov",
    "pytest-xdist",
    "pytest-testmon",
    "pytest-markdown-docs",
    "pytest-timeout",
    "pytest-fail-slow",
    "colorspacious",
]

[project.urls]
Homepage = "https://github.com/HabitableWorldsObservatory/hwostyle"
Issues = "https://github.com/HabitableWorldsObservatory/hwostyle/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hwostyle/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hwostyle"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/tests", "/.github"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures don't need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "hwostyle"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["hwostyle"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/hwostyle"]
