[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=25.1.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "hwostyle"
description = "Matplotlib style sheets and utilities for HWO direct imaging figures. Dual-mode dark (talks) and light (papers) themes with domain-specific colormaps."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.8", "cycler>=0.12", "tol-colors>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pre-commit>=3.5"]
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autoapi>=3.0",
    "ipython>=8.18",
    "matplotlib>=3.8",
]
test = [
    "pytest>=7.3.2",
    "hypothesis>=6.79.1",
    "pytest-cov>=1.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.1.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "colorspacious>=1.1.2",
]

[project.urls]
Homepage = "https://github.com/HabitableWorldsObservatory/hwostyle"
Issues = "https://github.com/HabitableWorldsObservatory/hwostyle/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hwostyle/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hwostyle"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/tests", "/.github"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures don't need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol_colors creates colormaps with Matplotlib's pending-deprecated set_bad API.
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:tol_colors",
    # Matplotlib 3.8 uses legacy pyparsing names while importing font and mathtext parsers.
    "ignore:'(parseString|resetCache|enablePackrat)' deprecated - use.*:pyparsing.warnings.PyparsingDeprecationWarning:matplotlib[.](_fontconfig_pattern|_mathtext)",
    # colorspacious 1.1.2 has unescaped TeX in a docstring, warned on Python 3.12.
    "ignore:invalid escape sequence.*:SyntaxWarning:.*colorspacious[./]comparison",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "hwostyle"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["hwostyle"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/hwostyle"]
